[project]
name = "patchbench"
version = "1.0.0"
description = "A repository-level benchmark for agentic vulnerability patching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alive-progress>=3.3.0",
    "pandas>=2.3.3",
]

[project.scripts]
patchbench = "patchbench.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patchbench"]
